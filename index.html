<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gridiron Dash v0.2</title>
<script src="/room-shim.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#dfe7ee; --surface:#f7fafc; --surface2:#e9eff5; --text:#0f1b2b; --muted:#566476; --line:#cfd9e3;
  --you:#2563eb; --cpu:#e8590c; --chain:#facc15; --star:#b7791f; --good:#15803d; --bad:#c2410c; --scrim:rgba(10,20,35,.55);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1422; --surface:#142035; --surface2:#1c2a43; --text:#e8eef7; --muted:#95a3b8; --line:#26385a;
    --you:#5b8cff; --cpu:#ff7a3d; --star:#f5c542; --good:#4ade80; --bad:#fb923c; --scrim:rgba(2,6,14,.68); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1422; --surface:#142035; --surface2:#1c2a43; --text:#e8eef7; --muted:#95a3b8; --line:#26385a;
  --you:#5b8cff; --cpu:#ff7a3d; --star:#f5c542; --good:#4ade80; --bad:#fb923c; --scrim:rgba(2,6,14,.68); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;overflow:hidden;overscroll-behavior:none}
body{height:100%;background:var(--bg);color:var(--text);font-family:var(--body);display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--chain);outline-offset:2px}
button:disabled{cursor:default}

/* ===== Hub ===== */
#hub{flex:1;display:flex;flex-direction:column;min-height:0}
#game{flex:1;display:none;flex-direction:column;min-height:0}
body.ingame #hub{display:none}
body.ingame #game{display:flex}
.hhead{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px}
.hhead .chip{width:8px;height:40px;border-radius:3px;flex:none}
.hh{flex:1;min-width:0}
.hname{font-family:var(--display);font-weight:800;font-size:23px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:13px;color:var(--muted);font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 11px;font-weight:700;font-size:14px}
.savest{font-size:11.5px;color:var(--muted);font-weight:700;text-align:right;margin-top:4px;white-space:nowrap}
.view{flex:1;overflow-y:auto;padding:14px 12px 24px;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.vwrap{max-width:620px;margin:0 auto}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 0 9px;font-weight:700;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
.tabs .ti{font-size:19px;line-height:1.2}
.tabs button[aria-current="page"]{color:var(--you)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.ct{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.05;margin:0 0 4px}
.cs{color:var(--muted);font-size:14.5px;line-height:1.4;margin:0}
.kick{font-family:var(--display);font-weight:600;font-size:17px;color:var(--muted)}
.btns{display:flex;gap:8px;margin-top:14px}
.btns .btn{flex:1}
.btn{width:100%;padding:13px;border-radius:14px;border:0;background:var(--you);color:#fff;font-family:var(--display);font-size:21px;font-weight:800}
.btn:disabled{opacity:.42}
.btn.alt{background:var(--surface2);color:var(--text)}
.btn.sm{font-size:17px;padding:10px 12px}
.btn.ghost{background:transparent;color:var(--muted);font-family:var(--body);font-size:15px;font-weight:700;padding:11px;margin-top:4px}
.btn.danger{background:#b91c1c}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:10px 0 14px}
.side{display:flex;flex-direction:column;gap:3px;min-width:0}
.side.r{align-items:flex-end;text-align:right}
.side b{font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
.side small{color:var(--muted);font-weight:700;font-size:13px}
.side .bar{width:34px;height:6px;border-radius:3px}
.at{font-family:var(--display);font-weight:600;color:var(--muted);font-size:18px}
.cmp{display:grid;gap:10px}
.cmpl{font-size:13px;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.cmpb{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:19px}
.cmpb span:last-child{text-align:right}
.split{height:8px;border-radius:4px;overflow:hidden;display:flex;background:var(--surface2)}
.split i{display:block;height:100%}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.stat{background:var(--surface2);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.stat span{font-size:12.5px;color:var(--muted);font-weight:700}
.capbar{height:10px;background:var(--surface2);border-radius:5px;overflow:hidden;margin:6px 0}
.capbar i{display:block;height:100%;background:var(--you)}
.capbar.over i{background:#dc2626}
.capt{font-size:13.5px;color:var(--muted);font-weight:600}
.capt b{color:var(--text)}
.warn{font-size:14px;color:var(--bad);font-weight:700;margin-top:8px;line-height:1.35}
.list{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.prow:last-child{border-bottom:0}
.prow .pp{font-family:var(--display);font-weight:600;color:var(--muted);font-size:15px}
.prow .pn{font-weight:700;font-size:15.5px;line-height:1.2;min-width:0}
.prow .pn small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:2px}
.prow .rt{display:flex;align-items:center;gap:10px}
.prow .money{font-weight:700;font-size:13px;color:var(--muted);text-align:right;line-height:1.2}
.prow.sel{background:var(--surface2);border-radius:10px}
.prow .tick{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff}
.prow.sel .tick{background:var(--you);border-color:var(--you)}
.ovr{font-family:var(--display);font-weight:800;font-size:24px;min-width:30px;text-align:right}
.ovr.hi{color:var(--star)} .ovr.lo{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.s{background:var(--you);color:#fff}
.tag.r{background:var(--star);color:#1a1200}
.gh{font-family:var(--display);font-weight:800;font-size:18px;margin:16px 2px 0;color:var(--muted)}
.gh:first-child{margin-top:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-bottom:6px;touch-action:pan-x}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13.5px;white-space:nowrap;flex:none}
.chips button[aria-pressed="true"]{background:var(--text);color:var(--surface);border-color:var(--text)}
.seg{display:grid;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:700;font-size:14.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.srow{display:grid;grid-template-columns:22px 6px 1fr 50px 38px 28px;gap:8px;align-items:center;padding:9px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;font-size:14.5px}
.srow.hd{font-size:12px;color:var(--muted);font-weight:700;padding-top:2px}
.srow .rk{color:var(--muted);font-weight:700;text-align:right}
.srow .tc{width:6px;height:20px;border-radius:2px}
.srow .tn{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.srow.me{background:var(--surface2);border-radius:8px}
.srow.cut{border-bottom:2px dashed var(--muted)}
.game{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.game:last-child{border-bottom:0}
.game .w{font-weight:700}
.game .l{color:var(--muted)}
.game .sc{text-align:right;font-variant-numeric:tabular-nums}
.game.mine{background:var(--surface2);border-radius:8px;padding-left:6px;padding-right:6px}
.news{font-size:14px;line-height:1.4;padding:7px 0;border-bottom:1px solid var(--line)}
.news:last-child{border-bottom:0}
.wknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.wknav b{font-family:var(--display);font-size:20px}
.wknav button{border:1px solid var(--line);background:var(--surface2);border-radius:10px;width:40px;height:34px;font-weight:800}
.pick{font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.big{font-family:var(--display);font-weight:800;font-size:46px;line-height:1}

#modal{position:fixed;inset:0;background:var(--scrim);display:none;z-index:45;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
.mpanel{background:var(--surface);color:var(--text);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));touch-action:pan-y;overscroll-behavior:contain}
.mtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.mtop .ct{margin:0}
.xbtn{border:0;background:var(--surface2);border-radius:50%;width:34px;height:34px;font-size:18px;font-weight:700;flex:none}
.psh{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.psovr{font-family:var(--display);font-weight:800;font-size:56px;line-height:.9;min-width:64px;text-align:center}
.psn{font-family:var(--display);font-weight:800;font-size:27px;line-height:1}
.pss{color:var(--muted);font-size:14px;font-weight:600;margin-top:5px;line-height:1.35}
.sb{display:grid;grid-template-columns:118px 1fr 28px;gap:10px;align-items:center;font-size:13.5px;padding:3px 0}
.sb i{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;display:block}
.sb i b{display:block;height:100%;background:var(--you)}
.sb em{font-style:normal;font-weight:700;text-align:right}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv span{color:var(--muted)} .kv b{font-weight:700;text-align:right}
.note{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.4}
.meter{height:12px;border-radius:6px;background:var(--surface2);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--cpu);transition:width .2s}
.meter.ok i{background:var(--good)}

#startOv{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto;touch-action:pan-y}
#startOv.hide{display:none}
.sbox{width:100%;max-width:380px;text-align:center}
.logo{font-family:var(--display);font-weight:800;font-size:64px;line-height:.84;margin:0 0 8px}
.logo span{display:block;color:var(--you)}
.tagl{color:var(--muted);font-weight:500;font-size:15.5px;margin-bottom:20px;line-height:1.4}
.sbox .btn{margin-bottom:10px}
.lbl{font-size:13px;color:var(--muted);font-weight:700;text-align:left;margin:4px 2px 6px}
#htoast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translate(-50%,-8px);background:rgba(6,14,26,.88);color:#fff;
  font-weight:700;font-size:14px;line-height:1.3;padding:8px 14px;border-radius:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;
  width:max-content;max-width:90%;text-align:center}
#htoast.show{opacity:1;transform:translate(-50%,0)}

/* ===== Game ===== */
#hud{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 14px 7px}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;max-width:560px;margin:0 auto}
.team{display:flex;align-items:center;gap:8px;font-family:var(--display);min-width:0}
.team.cpu{justify-content:flex-end}
.team .chip{width:6px;height:26px;border-radius:2px;flex:none}
.nm{font-weight:600;font-size:17px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{font-weight:800;font-size:30px;line-height:1;min-width:1.2em;text-align:center;font-variant-numeric:tabular-nums}
.qtr{font-family:var(--display);font-weight:800;font-size:15px;padding:3px 9px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.sit{text-align:center;font-size:13px;color:var(--muted);font-weight:700;margin-top:3px;min-height:17px}
#stage{flex:1;position:relative;overflow:hidden;background:#24532a}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#pauseBtn{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(6,14,26,.55);color:#fff;font-weight:800;font-size:14px;z-index:4}
#banner{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;z-index:4;opacity:0;padding:0 12px}
#banner.show{animation:pop .42s cubic-bezier(.2,1.5,.4,1) forwards}
#banner .big{font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,72px);line-height:.95;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.45)}
#banner .sub{margin-top:10px;display:inline-block;background:rgba(6,14,26,.72);color:#fff;font-weight:700;font-size:15px;padding:6px 14px;border-radius:999px}
#banner .dcall{margin-top:7px;color:#fff;font-weight:700;font-size:13.5px;text-shadow:0 1px 5px rgba(0,0,0,.8)}
@keyframes pop{0%{opacity:0;transform:scale(.55)}100%{opacity:1;transform:scale(1)}}
#toast{position:absolute;top:58px;left:50%;transform:translate(-50%,-8px);background:rgba(6,14,26,.84);color:#fff;font-weight:700;font-size:14px;line-height:1.3;
  padding:7px 14px;border-radius:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:6;width:max-content;max-width:78%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#ctrl{position:absolute;right:12px;bottom:18px;display:flex;flex-direction:column;align-items:flex-end;gap:12px;z-index:3;opacity:0;pointer-events:none;transition:opacity .15s}
#ctrl.show{opacity:1;pointer-events:auto}
#throws{display:flex;gap:7px;opacity:0;pointer-events:none;transition:opacity .12s}
#throws.show{opacity:1;pointer-events:auto}
#throws button{width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,255,255,.92);font-family:var(--display);font-weight:800;font-size:22px;color:#fff;background:#dc2626;box-shadow:0 4px 12px rgba(0,0,0,.35);padding:0}
#throws button[data-st="open"]{background:#16a34a}
#throws button[data-st="tight"]{background:#ca8a04}
#throws button:active,#burst:active{transform:scale(.93)}
#burst{width:84px;height:84px;border-radius:50%;border:3px solid rgba(255,255,255,.92);padding:0;background:conic-gradient(rgba(10,20,35,.6) calc(var(--cd,0)*360deg), #facc15 0);
  color:#2a2000;font-family:var(--display);font-weight:800;font-size:19px;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--surface);color:var(--text);border-radius:22px 22px 0 0;
  box-shadow:0 -12px 34px rgba(0,0,0,.28);padding:12px 12px 14px;transform:translateY(108%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:5;max-height:78%;overflow:auto;touch-action:pan-y}
.sheet.show{transform:none}
.ph{display:flex;justify-content:space-between;align-items:flex-start;margin:0 2px 6px;gap:10px}
.dd{font-family:var(--display);font-weight:800;font-size:30px;line-height:1}
.fp{font-size:14px;color:var(--muted);font-weight:700;margin-top:3px}
.rosbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 11px;font-weight:700;font-size:14px;white-space:nowrap}
.scout{font-size:13.5px;line-height:1.35;color:var(--muted);margin:0 2px 10px;font-weight:500}
.scout b{color:var(--text);font-weight:700}
.plays{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.play{appearance:none;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:9px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:86px;transition:transform .08s}
.play:active{transform:scale(.96)}
.play .em{font-size:21px;line-height:1.15}
.play .t{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.05}
.play .d{font-size:11.5px;color:var(--muted);line-height:1.2;font-weight:500}
.play.kick{border-style:dashed}
.ov{position:absolute;inset:0;display:none;place-items:center;background:var(--scrim);z-index:8;padding:16px}
.ov.show{display:grid}
.box{background:var(--surface);color:var(--text);border-radius:24px;padding:22px 20px 18px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.4);text-align:center;max-height:100%;overflow:auto;touch-action:pan-y}
.box .btn{margin-top:8px}
.cpuhead{font-family:var(--display);font-weight:800;font-size:24px;color:var(--cpu)}
.cpustart{color:var(--muted);font-size:14.5px;margin:4px 0 16px;line-height:1.4}
.res{font-family:var(--display);font-weight:800;font-size:46px;line-height:1;min-height:46px}
.meta{color:var(--muted);font-weight:700;font-size:14.5px;margin-top:6px;min-height:20px}
.det{font-size:15px;margin:10px 0 14px;min-height:20px}
.final{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted)}
.fscore{display:flex;justify-content:center;align-items:center;gap:18px;margin:6px 0 4px;font-family:var(--display)}
.fscore div{display:flex;flex-direction:column;align-items:center}
.fscore b{font-size:58px;line-height:1}
.fscore span{font-weight:600;font-size:17px;color:var(--muted)}
.verdict{font-family:var(--display);font-weight:800;font-size:30px;margin:8px 0 12px}
.ros{text-align:left;padding:18px 16px 16px;display:flex;flex-direction:column;max-height:100%}
.rmeta{font-size:13.5px;color:var(--muted);margin:0 2px 10px;line-height:1.35}
.rlist{overflow:auto;flex:1;margin:0 -4px;padding:0 4px}
.row{display:grid;grid-template-columns:38px 1fr auto 34px;gap:8px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.row .num{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted)}
.row .pn{font-weight:700;font-size:15px;line-height:1.2;min-width:0}
.row .pn small{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
.row .pos{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted)}

    if(Math.random()<bp){routes[k]=null;return;}

/* ---------- stamina, injuries and rotation ---------- */
const DRAIN={QB:.4,OL:.5,K:.3,RB:1.1,WR:1,TE:.9,DL:1,LB:1,CB:1,S:.9};
const WBASE={QB:222,RB:212,WR:196,TE:250,OL:312,K:192,DL:288,LB:240,CB:192,S:206};
function wtOf(rp){if(!rp.wt)rp.wt=Math.round((WBASE[rp.pos]||220)+(((rp.st&&rp.st.str)||70)-70)*.8+gauss()*7);return rp.wt;}
function costFor(rp,base){return base*(1.35-(rp.sta||75)/200);}
function enFrac(p){return clamp((p.rp.en??100)/100,0,1);}
/* a shove: pushes b away from a. Distance grows with a's strength and shrinks with b's weight. */
function shove(P,a,b){
  const isCar=P&&P.ball&&P.ball.holder===a,sa=(isCar?RT(a,'sfa')*.6+RT(a,'str')*.4+FX(a,'stiff')*100:a.team==='off'?RT(a,'ibl')*.5+RT(a,'str')*.5+FX(a,'shove')*100:Math.max(RT(a,'pmv'),RT(a,'bsh'))*.5+RT(a,'str')*.5+FX(a,'rush')*60),wb=wtOf(b.rp),push=clamp(2.1*(sa/80)*Math.pow(225/wb,1.1)*(.75+.25*enFrac(a)),.5,4.5);
  let dx=b.x-a.x,dy=b.y-a.y;const m=Math.hypot(dx,dy)||1;dx/=m;dy/=m;
  b.vx=dx*push*3.2;b.vy=dy*push*3.2;b.x+=dx*push*.35;b.y+=dy*push*.35;
  b.stun=Math.max(b.stun,.35+push*.18);
  if(b.engagedBy)release(b);if(b.engaging&&b.engaging.engagedBy===b)release(b.engaging);
  if(a.engagedBy===b)release(a);
  a.rp.en=Math.max(0,(a.rp.en??100)-costFor(a.rp,8));b.rp.en=Math.max(0,(b.rp.en??100)-2);
  a.blkCD=1.2;a.shoves=(a.shoves||0)+1;
  return push;
}
function blockTarget(P,h){
  if(h.engagedBy)return h.engagedBy;
  if(h.engaging&&h.engaging.engagedBy===h)return h.engaging;
  const foes=h.team==='off'?P.def:P.off;let t=null,bd=2.6;
  for(const f of foes){const d=dist(f,h);if(d<bd){bd=d;t=f;}}
  return t;
}
function doBlockFor(P,h,loud){
  if(!h||!h.rp||!h.rp.st||(h.blkCD||0)>0)return;
  if((h.rp.en??100)<8){if(loud)flash('Too tired to block. Rest him.',1100);return;}
  const t=blockTarget(P,h);
  if(!t){if(loud)flash('Nobody in reach',700);h.blkCD=.3;return;}
  const push=shove(P,h,t);
  if(loud){flash(push>2.6?`Pancake! #${t.rp.num} ${t.rp.name} goes flying`:push>1.4?`Shoved #${t.rp.num} ${t.rp.name} away`:`#${t.rp.num} ${t.rp.name} barely budged (${wtOf(t.rp)} lb)`,1100);buzz(20);}
}

  if(NET.on&&G.state==='spect'){NET.inp.k=(NET.inp.k||0)+1;return;}
  const P=G.play;if(G.state!=='live'||G.paused||!P)return;

/* computer-controlled players on both teams shove on their own */
function aiShoves(P,car,dt){
  for(const p of P.players){
    p.blkCD=Math.max(0,(p.blkCD||0)-dt);
    if((p===P.ctrl&&isLocal(offCtl()))||(p===P.dh&&P.dhCtl))continue;

function aiTradeWeek(L){
  const ais=L.teams.filter(t=>!HU(L).includes(t.id)).map(t=>t.id);let made=0;
  for(let n=0;n<3&&made<2;n++){
    if(Math.random()>.45)continue;
    const A=pick(ais),dA=depthH(L,A);let need=null,gap=3;
    for(const pos of ['QB','RB','WR','TE','OL','DL','LB','CB','S']){const st=dA[pos][START[pos]-1],g=78-(st?st.ovr:40);if(g>gap){gap=g;need=pos;}}
    if(!need)continue;
    const base=(dA[need][START[need]-1]||{ovr:40}).ovr,cands=[];
    for(const B of ais){if(B===A)continue;const ex=depthH(L,B)[need][START[need]];if(ex&&ex.ovr>=base+3&&ex.yrs>0)cands.push([B,ex]);}
    if(!cands.length)continue;
    const [B,tgt]=pick(cands),want=Math.max(.5,tv(tgt))*1.05,ddA=depth(L,A);
    const pool=roster(L,A).filter(p=>p.yrs>0&&!(p.inj>0)&&p.pos!==need&&ddA[p.pos].indexOf(p)>=START[p.pos]).sort((a,b)=>tv(b)-tv(a)).slice(0,12);
    const pa=payroll(L,A),pb=payroll(L,B);let best=null,bd=1e9;
    const consider=set=>{const v=set.reduce((x,p)=>x+tv(p),0),sal=set.reduce((x,p)=>x+p.sal,0);if(v<want*.95||pa-sal+tgt.sal>L.cap||pb+sal-tgt.sal>L.cap)return;const dv=v-want;if(dv<bd){bd=dv;best=set;}};
    for(let i=0;i<pool.length;i++){consider([pool[i]]);for(let j=i+1;j<pool.length;j++)consider([pool[i],pool[j]]);}
    if(!best||bd>want*.4)continue;
    for(const p of best){p.tm=B;p.num=pickNum(L,B,p.pos);}tgt.tm=A;tgt.num=pickNum(L,A,tgt.pos);made++;
    news(L,`Trade: the ${L.teams[A].name} get ${tgt.mpos||tgt.pos} ${tgt.fn} ${tgt.ln} (${tgt.ovr}) from the ${L.teams[B].name} for ${best.map(p=>`${p.mpos||p.pos} ${p.fn} ${p.ln}`).join(' and ')}.`);
  }
}

function nflPlayPoRound(L,pre){
  const P2=L.po,games=P2.rounds[P2.r],nm=NFL_RN[P2.r],simmed=[],played=[];
  games.forEach((g,gi)=>{if(g.length>2)return;let sa,sb,eng=false;const[a,b]=g,q=pre&&pre[gi];
    if(q){[sa,sb]=q.s;eng=!!q.e;if(sa===sb){if(Math.random()<.5)sa+=3;else sb+=3;}}else[sa,sb]=nflSimGame(L,a,b,true);

  nflUpkeep(L,played,simmed);

    if(HU(L).includes(L.champ))L.fin[L.champ]='Won the championship';

    const order=st.map(t=>t.id).filter(t=>t!==L.champ&&t!==ru).reverse();order.push(ru,L.champ);L.lastOrder=order;
    L.prevRank={};for(const k of Object.keys(NFL_DIV))st.filter(t=>t.div===k).forEach((t,i)=>L.prevRank[t.id]=i);

  }

  if(P2.r===0){for(const c of ['AFC','NFC']){const left=[P2.cseeds[c][0],...games.filter(g=>L.teams[g[0]].conf===c).map(win)].sort((a,b)=>sd(a)-sd(b));next.push([left[0],left[3]],[left[1],left[2]]);}}

}

  o.players=o.players.map(a=>{const[id,fn,ln,pos,age,sv,pot,sal,yrs,num,tm,dr,ss,sta,inj,wt,mid,dlt,wear,rest]=a;const base=mid!=null&&mid>=0?SSP[mid]:null;const st=defSt();if(base){Object.assign(st,base.st);for(const k of MK)if(k!=='inj'&&k!=='sta'&&k!=='kpw'&&k!=='kac')st[k]=clamp(Math.round(st[k]+(dlt||0)),20,99);}TK[pos].forEach((k,i)=>st[k]=sv[i]);if(base){st.hnd=st.cth;st.tkl=st.tak;}
    const p={id,fn,ln,pos,age,st,pot,sal:sal/100,yrs,num,tm,dr,ss:ss||0,sta:sta||75,inj:inj||0,wt:wt||0,wear:wear||0,rest:!!rest};if(base)Object.assign(p,{mid,mpos:base.mpos,mo:base.ovr,dlt:dlt||0,ht:base.ht,xf:base.xf,ab:base.ab,arch:base.arch,hand:base.hand,style:base.style,col:base.col,odf:base.odf,sdf:base.sdf,yp:(base.yp||0)+((o.season||1)-1)});finishP(p);o._by.set(id,p);return p;});

}
async function initStore(){

    }

async function loadSave(){

    const md=m.data();let s='';

const CHUNK=80000;
async function writeSave(s){
  if(Store.mode==='db'){
    const n=Math.ceil(s.length/CHUNK);
    for(let i=0;i<n;i++)await col().doc('dyn'+i).set({s:s.slice(i*CHUNK,(i+1)*CHUNK)});
    await col().doc('dynmeta').set({n,at:Date.now(),v:1});
  }else if(Store.mode==='local')localStorage.setItem('gd2-dyn',s);
}

function save(){if(!LG||LG.me<0)return;Store.dirty=true;clearTimeout(Store.timer);Store.timer=setTimeout(flushSave,500);}
async function flushSave(){
  if(Store.saving||!Store.dirty||!LG)return;
  if(Store.mode==='mem'){setSaveStatus('Not saving on this device');return;}
  Store.saving=true;Store.dirty=false;setSaveStatus('Saving…');
  try{await writeSave(serialize(LG));setSaveStatus('Saved');}
  catch(e){
    if(e&&e.code==='unavailable'){Store.dirty=true;setTimeout(flushSave,1500+Math.random()*1000);setSaveStatus('Retrying save…');}
    else setSaveStatus(e&&e.code==='quota_exceeded'?'Save failed: storage is full':'Save failed');

function tradeEval(L,getIds,giveIds){
  const get=getIds.map(id=>L._by.get(id)),give=giveIds.map(id=>L._by.get(id)),them=get[0].tm;
  const vGet=get.reduce((s,p)=>s+tv(p),0),vGive=give.reduce((s,p)=>s+tv(p),0);
  const sg=get.reduce((s,p)=>s+p.sal,0),sv=give.reduce((s,p)=>s+p.sal,0);
  const myPay=Math.round((payroll(L,L.me)-sv+sg)*10)/10,theirPay=payroll(L,them)-sg+sv;
  const offs=L.phase!=='reg'&&L.phase!=='po',myN=roster(L,L.me).filter(p=>p.yrs>0).length-give.length+get.length;
  let reason='';
  if(!give.length)reason='Add players to offer.';
  else if(myPay>L.cap)reason=`That puts you ${money(myPay-L.cap)} over the cap.`;
  else if(theirPay>L.cap)reason='That puts them over the cap.';
  else if(myN>(offs?OFF_MAX:ROSTER_MAX))reason='Your roster would be too big.';
  const need=vGet*1.1+.5;
  return {ok:!reason&&vGive>=need,reason,pctv:vGive/Math.max(.5,need),myPay};
}

const SB_OFF=['QB','WR','WR','RB','TE','WR','OL','OL','OL','OL','OL'];
const SB_DEF=['CB','CB','S','LB','DL','DL','LB','S','CB','DL','DL'];
const SB_ROUTES=['go','slant','out','qout','dig','curl','post','corner','hitch','comeback','seam','drag','sluggo','flat','swing','wheel','sit'];
const SB={pool:null,cfg:null,pick:null,sel:null,pickMode:null,last:null};
function sbPool(pos){
  SB.pool=SB.pool||{};
  if(!SB.pool[pos]){const u=new Set(),real=SSP.filter(x=>x.pos===pos).map(x=>ssRP(x,u)),gen=Array.from({length:pos==='OL'?14:8},()=>makeRP(pos,-2,u));SB.pool[pos]=real.concat(gen).sort((a,b)=>b.ovr-a.ovr);}
  return SB.pool[pos];
}
function sbUsed(cfg){return new Set([...cfg.off,...cfg.def].map(x=>x.rp));}
function sbFreshPlayer(cfg,pos,self){const used=sbUsed(cfg);if(self)used.delete(self.rp);return sbPool(pos).find(p=>!used.has(p))||sbPool(pos)[0];}
function sbResize(cfg,side,n){
  const arr=cfg[side],D=side==='off'?SB_OFF:SB_DEF;
  while(arr.length>n)arr.pop();
  while(arr.length<n){const pos=D[arr.length];arr.push({pos,rp:sbFreshPlayer(cfg,pos),p:null,asg:null,motion:false});}
  for(const x of arr)x.p=null;
